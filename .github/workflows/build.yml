name: Build/Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest] # Builds for both Mac and Win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Next.js
        run: pnpm run build

      - name: Resolve symlinks in standalone output
        run: node scripts/resolve-standalone-symlinks.js

      - name: Clean standalone output for packaging
        shell: bash
        run: |
          # Remove broken symlinks
          find .next/standalone -xtype l -delete 2>/dev/null || true

          # Remove packages provided by electron-builder or not needed
          rm -rf .next/standalone/node_modules/better-sqlite3* 2>/dev/null || true
          rm -rf .next/standalone/.next/node_modules/better-sqlite3* 2>/dev/null || true
          rm -rf .next/standalone/node_modules/@img 2>/dev/null || true
          rm -rf .next/standalone/node_modules/sharp 2>/dev/null || true
          rm -rf .next/standalone/node_modules/.pnpm 2>/dev/null || true

          # Remove package.json from standalone root — it triggers electron-builder's
          # pnpm dependency collector which silently skips node_modules in extraResources.
          # server.js embeds all config via __NEXT_PRIVATE_STANDALONE_CONFIG so this is safe.
          find .next/standalone -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.next/*" -delete 2>/dev/null || true

      - name: Fix standalone directory structure
        run: node scripts/fix-standalone.js

      - name: Debug standalone contents
        shell: bash
        run: |
          echo "=== Standalone root ==="
          ls -la .next/standalone/
          echo "=== node_modules (top-level) ==="
          ls .next/standalone/node_modules/ 2>/dev/null | head -20 || echo "NO node_modules at root"
          # Check nested structure too (macOS CI nests under project path)
          for d in .next/standalone/*/; do
            if [ -d "$d/node_modules" ]; then
              echo "=== node_modules in $d ==="
              ls "$d/node_modules/" | head -20
            fi
          done

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      - name: Copy Electron-rebuilt better-sqlite3 to standalone
        shell: bash
        run: |
          SQLITE_SRC=$(node -e "console.log(require.resolve('better-sqlite3/package.json').replace('/package.json',''))")
          cp -r "$SQLITE_SRC" .next/standalone/node_modules/better-sqlite3
          echo "Copied better-sqlite3 from $SQLITE_SRC"
          ls .next/standalone/node_modules/better-sqlite3/

      - name: Build & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish always

      - name: Verify packaged standalone has node_modules
        shell: bash
        run: |
          # Find the unpacked resources directory in dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            RESOURCES=$(find dist -type d -name "standalone" -path "*/resources/*" | head -1)
          else
            RESOURCES=$(find dist -type d -name "standalone" -path "*/Resources/*" | head -1)
          fi

          if [ -z "$RESOURCES" ]; then
            echo "WARNING: Could not find standalone in packaged output — skipping verification"
            exit 0
          fi

          echo "Standalone location: $RESOURCES"
          ls "$RESOURCES/"

          if [ ! -d "$RESOURCES/node_modules" ]; then
            echo "ERROR: node_modules is MISSING from packaged standalone!"
            echo "electron-builder likely stripped it during packaging."
            exit 1
          fi

          if [ ! -d "$RESOURCES/node_modules/next" ]; then
            echo "ERROR: next module is MISSING from packaged node_modules!"
            exit 1
          fi

          echo "Verification passed: node_modules/next exists in packaged output"
