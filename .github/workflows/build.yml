name: Build/Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest] # Builds for both Mac and Win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs pnpm
      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Next.js
        run: pnpm run build

      - name: Clean broken symlinks from standalone output
        shell: bash
        run: |
          # Remove any broken symlinks/pnpm store references in standalone
          find .next/standalone -xtype l -delete 2>/dev/null || true
          # Remove better-sqlite3 from standalone (provided by electron-builder)
          rm -rf .next/standalone/.next/node_modules/better-sqlite3* 2>/dev/null || true
          rm -rf .next/standalone/node_modules/better-sqlite3* 2>/dev/null || true

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      - name: Build & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish always
